allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - lightningcss
  - sharp
  - workerd
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
  vitest: 5.1.0
  "@vitest/coverage-v8": 5.1.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@tanstack/react-router@1.170.45"
  - "@tanstack/react-start-client@1.168.43"
  - "@tanstack/react-start-rsc@0.1.64"
  - "@tanstack/react-start-server@1.167.51"
  - "@tanstack/react-start@1.169.3"
  - "@tanstack/router-core@1.171.38"
  - "@tanstack/router-generator@1.167.45"
  - "@tanstack/router-plugin@1.168.47"
  - "@tanstack/start-client-core@1.170.38"
  - "@tanstack/start-plugin-core@1.171.54"
  - "@tanstack/start-server-core@1.169.44"
  - "@tanstack/start-storage-context@1.167.40"
  - "@voidzero-dev/vite-plus-core@1.5.1"
  - vite-plus@1.5.1
