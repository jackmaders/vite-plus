name: Setup Playwright
description: Caches and installs a Playwright browser and its system dependencies

inputs:
  browser:
    description: Playwright browser to install
    required: true

runs:
  using: composite
  steps:
    - name: Configure reliable Ubuntu package mirrors
      shell: bash
      run: |
        sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ inputs.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-${{ inputs.browser }}-
    - name: Install Playwright browser and system dependencies
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: vpx playwright install --with-deps ${{ inputs.browser }}
    - name: Install missing system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        if ! vpx playwright install-deps --dry-run ${{ inputs.browser }} > /dev/null 2>&1; then
          vpx playwright install-deps ${{ inputs.browser }}
        fi
