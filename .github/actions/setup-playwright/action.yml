name: Setup Playwright
description: Caches and installs a Playwright browser and its system dependencies

inputs:
  browser:
    description: Playwright browser to install
    required: true

runs:
  using: composite
  steps:
    - name: Get installed Playwright version
      id: playwright-version
      shell: bash
      run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ inputs.browser }}-${{ steps.playwright-version.outputs.version }}
    - name: Install Playwright system dependencies
      shell: bash
      run: vpx playwright install-deps ${{ inputs.browser }}
    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: vpx playwright install ${{ inputs.browser }}
