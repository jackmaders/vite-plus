name: Run Browser Tests
description: Sets up a Playwright browser, runs browser tests, and uploads failure reports

inputs:
  base-url:
    description: Base URL to run Playwright tests against (skips starting a local server when set)
    required: false
    default: ""
  browser:
    description: Playwright browser project to run
    required: true

runs:
  using: composite
  steps:
    - name: Set up Playwright
      uses: ./.github/actions/setup-playwright
      with:
        browser: ${{ inputs.browser }}
    - name: Run browser tests
      shell: bash
      env:
        PLAYWRIGHT_BASE_URL: ${{ inputs.base-url }}
        PLAYWRIGHT_TARGET: preview
      run: vp run test:browser --project=${{ inputs.browser }}
    - name: Upload failure report
      if: ${{ !cancelled() && failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report-${{ inputs.browser }}
        path: |
          playwright-report/
          test-results/
        retention-days: 7
