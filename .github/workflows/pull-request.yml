name: Pull Request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 🔎 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          run-install: true
          cache: true
      - name: Check code quality
        env:
          FULL_CHECK: "1"
        run: vp check
      - name: Check architecture
        run: vp run lint:arch --fail-on-warnings

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prevent migration history rewrites
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          fi
          CHANGED_HISTORY=$(git diff --no-renames --name-only --diff-filter=MDT "$BASE_SHA" "$HEAD_SHA" -- drizzle)
          if [ -n "$CHANGED_HISTORY" ]; then
            echo "::error::Existing migrations and snapshots are immutable. Add a new migration instead of modifying, deleting, or renaming history."
            printf '%s\n' "$CHANGED_HISTORY"
            exit 1
          fi
      - name: Enforce single migration per PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA" -- "drizzle/**/*.sql" | wc -l)
          [ "$NEW_MIGRATIONS" -le 1 ] || { echo "::error::PR introduces $NEW_MIGRATIONS migrations (max 1 allowed)."; exit 1; }
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          run-install: true
          cache: true
      - name: Build project
        run: CLOUDFLARE_ENV=preview vp run build
      - name: Verify generated routes
        run: git diff --exit-code -- src/app/routeTree.gen.ts
      - name: Verify generated types
        run: vp run cf:generate && git diff --exit-code -- worker-configuration.d.ts
      - name: Verify generated migrations
        run: |
          vp run db:generate
          git diff --exit-code -- drizzle/
          test -z "$(git ls-files --others --exclude-standard -- drizzle)"
      - name: Verify worker deployment
        run: vp run deploy --dry-run
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: |
            dist/
            .wrangler/deploy/config.json
          include-hidden-files: true
          retention-days: 1

  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          run-install: true
          cache: true
      - name: Run unit tests
        run: vp test --coverage

  browser-tests:
    name: 🎭 Browser Tests (${{ matrix.browser }})
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          run-install: true
          cache: true
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: .
      - name: Migrate local database
        run: vp run db:migrate --local --env preview
      - name: Run browser tests
        uses: ./.github/actions/run-playwright
        env:
          BETTER_AUTH_SECRET: template-ci-local-only-secret-value
        with:
          browser: ${{ matrix.browser }}

  status:
    name: ✅ Status Checks
    if: ${{ always() }}
    needs: [quality, build, test, browser-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
