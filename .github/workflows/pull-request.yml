name: Pull Request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 🔎 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          run-install: true
          cache: true
      - name: Check code quality
        env:
          FULL_CHECK: "1"
        run: vp check
      - name: Check architecture
        run: vp run lint:arch --fail-on-warnings

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          run-install: true
          cache: true
      - name: Build production configuration
        run: vp run build
      - name: Build local preview
        run: |
          printf 'BETTER_AUTH_SECRET="%s"\n' "$(openssl rand -base64 32)" > .dev.vars
          vp run build:preview
      - name: Verify generated routes
        run: git diff --exit-code -- src/app/routeTree.gen.ts
      - name: Verify generated types
        run: vp run cf:generate && git diff --exit-code -- worker-configuration.d.ts
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: |
            dist/
            .wrangler/deploy/config.json
          include-hidden-files: true
          retention-days: 1

  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          run-install: true
          cache: true
      - name: Run unit tests
        run: vp test --coverage

  e2e:
    name: 🎭 Browser Tests (${{ matrix.browser }})
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          run-install: true
          cache: true
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: .
      - name: Migrate local preview database
        run: vp run db:migrate:preview
      - name: Run browser tests
        uses: ./.github/actions/run-playwright
        with:
          browser: ${{ matrix.browser }}

  status:
    name: ✅ Status Checks
    if: ${{ always() }}
    needs: [quality, build, test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
